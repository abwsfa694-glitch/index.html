<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روليت الأمراء - نسخة احترافية مستقرة</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:linear-gradient(to bottom,#111,#2b2b2b);
    font-family:Tahoma;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:white;
}

h2{
    margin:20px 0 5px;
    color:#ff9800;
}

#owner{
    color:#00e5ff;
    margin-bottom:10px;
    font-size:16px;
}

#wheelContainer{
    position:relative;
    width:400px;
    height:400px;
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    transform:translateZ(0);
    will-change:transform;
}

#pointer{
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:30px solid #ff9800;
    z-index:5;
}

textarea{
    width:90%;
    max-width:400px;
    height:180px;
    margin-top:20px;
    padding:10px;
    font-size:18px;
    border-radius:8px;
    resize:none;
}

button{
    padding:10px 25px;
    margin:8px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.start{background:#ff9800;color:white;}
.delete{background:#e53935;color:white;}
.reset{background:#555;color:white;}

#result{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>روليت الأمراء يرحب بكم</h2>
<div id="owner">المالك: @mgpka</div>

<div id="wheelContainer">
    <div id="pointer"></div>
    <canvas id="wheel" width="400" height="400"></canvas>
</div>

<div id="result"></div>
<div id="deleteContainer"></div>

<button class="start" onclick="spin()">بدء</button>
<button class="reset" onclick="resetWheel()">إعادة ضبط</button>

<textarea id="names" placeholder="اكتب الأسماء هنا (حد أقصى 40 لاعب)"></textarea>

<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const center=200;

let names=[];
let baseRotation=0;
let spinning=false;
let lastWinnerIndex=null;

function updateNames(){
    names=document.getElementById("names").value
    .split("\n")
    .map(n=>n.trim())
    .filter(n=>n!=="")
    .slice(0,40);
}

function drawWheel(){
    if(names.length===0) return;

    const arc=2*Math.PI/names.length;
    ctx.clearRect(0,0,400,400);

    for(let i=0;i<names.length;i++){
        ctx.beginPath();
        ctx.moveTo(center,center);
        ctx.fillStyle=`hsl(${i*360/names.length},70%,50%)`;
        ctx.arc(center,center,center,i*arc,(i+1)*arc);
        ctx.fill();

        ctx.save();
        ctx.translate(center,center);
        ctx.rotate(i*arc+arc/2);

        let fontSize = names.length>30?9:
                       names.length>20?11:
                       names.length>12?14:18;

        ctx.fillStyle="#000";
        ctx.font=`${fontSize}px Arial`;
        ctx.textAlign="right";
        ctx.fillText(names[i],center-10,4);

        ctx.restore();
    }
}

function spin(){
    if(spinning) return;
    updateNames();
    if(names.length<2) return;

    drawWheel();
    spinning=true;

    lastWinnerIndex=Math.floor(Math.random()*names.length);
    let arcDeg = 360 / names.length;
    let finalAngle = 270 - (lastWinnerIndex * arcDeg) - (arcDeg / 2);
    let totalRotation = 3600 + finalAngle;

    let start=null;
    let duration=5000;

    function animate(timestamp){
        if(!start) start=timestamp;
        let progress=timestamp-start;
        let t=Math.min(progress/duration,1);

        let ease=1-Math.pow(1-t,4);
        let current=totalRotation*ease;

        canvas.style.transform=
        `rotate3d(0,0,1,${baseRotation+current}deg)`;

        if(t<1){
            requestAnimationFrame(animate);
        }else{
            baseRotation+=totalRotation;
            spinning=false;

            if(names.length === 1){
                document.getElementById("result").innerHTML =
                    "🎉 الفائز: " + names[0];
            } else {
                document.getElementById("result").innerHTML =
                    "❌ خسرت: " + names[lastWinnerIndex];
            }

            showDeleteButton();
        }
    }

    requestAnimationFrame(animate);
}

function showDeleteButton(){
    document.getElementById("deleteContainer").innerHTML=
    `<button class="delete" onclick="deleteWinner()">حذف الاسم</button>`;
}

function deleteWinner(){
    if(lastWinnerIndex===null) return;

    names.splice(lastWinnerIndex,1);
    document.getElementById("names").value=names.join("\n");
    document.getElementById("result").innerHTML="";
    document.getElementById("deleteContainer").innerHTML="";
    canvas.style.transform="rotate3d(0,0,1,0deg)";
    baseRotation=0;
    drawWheel();
}

function resetWheel(){
    baseRotation=0;
    canvas.style.transform="rotate3d(0,0,1,0deg)";
    document.getElementById("result").innerHTML="";
    document.getElementById("deleteContainer").innerHTML="";
}
</script>

</body>
</html
